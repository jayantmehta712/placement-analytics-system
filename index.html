<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>placement-analytics-system</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5d6778;
      --line: #dde3ea;
      --paper: #ffffff;
      --wash: #eef5f8;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --gold: #d99a25;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, .12), rgba(217, 154, 37, .10)),
        var(--wash);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    main {
      width: min(860px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(23, 32, 42, .10);
      padding: clamp(24px, 5vw, 52px);
    }

    .eyebrow {
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin: 0 0 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 1;
      overflow-wrap: anywhere;
    }

    p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
      margin: 22px 0 0;
      max-width: 720px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 28px 0 34px;
      padding: 0;
      list-style: none;
    }

    .meta li {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-size: 14px;
      padding: 8px 12px;
      background: #fbfdfe;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      color: inherit;
    }

    .button {
      align-items: center;
      border-radius: 6px;
      display: inline-flex;
      font-weight: 700;
      min-height: 46px;
      padding: 0 18px;
      text-decoration: none;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      margin-top: 42px;
      padding-top: 18px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Live repository page</p>
    <h1>placement-analytics-system</h1>
    <p>Full-stack campus placement analytics dashboard with FastAPI, Chart.js, SQLite, and ML placement prediction.</p>
    <ul class="meta" aria-label="Repository details">
      <li>Python</li>
      <li>Updated 16 Jun 2026</li>
      <li>GitHub Pages</li>
    </ul>
    <div class="actions">
      <a class="button primary" href="https://github.com/jayantmehta712/placement-analytics-system">View source</a>
      <a class="button secondary" href="https://jayantmehta712.github.io/placement-analytics-system/">Open live page</a>
    </div>
    <footer>Published from the <code>gh-pages</code> branch.</footer>
  </main>
</body>
</html>
